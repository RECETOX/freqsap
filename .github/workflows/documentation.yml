name: documentation

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
      - name: Python info
        shell: bash -e {0}
        run: |
          which python
          python --version
      - name: Install dependencies
        run: uv sync --frozen
      - name: Install pandoc using apt
        run: sudo apt install pandoc
      - name: Build documentation
        run: uv run make coverage doctest html
        working-directory: docs
